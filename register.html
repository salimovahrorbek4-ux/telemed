<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — TeleMed UZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-heartbeat"></i>
            <span>TeleMed<strong>UZ</strong></span>
        </div>
        <p class="auth-subtitle">Yangi hisob yarating</p>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Ism</label>
                    <input type="text" class="form-input" placeholder="Ismingiz" required>
                </div>
                <div class="form-group">
                    <label>Familiya</label>
                    <input type="text" class="form-input" placeholder="Familiyangiz" required>
                </div>
            </div>
            <div class="form-group">
                <label>Telefon raqam</label>
                <div class="form-input-icon">
                    <i class="fas fa-phone"></i>
                    <input type="tel" class="form-input" placeholder="+998 90 000 00 00" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <div class="form-input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-input" placeholder="email@example.com">
                </div>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <div class="form-input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-input" placeholder="Kamida 8 ta belgi" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-check">
                    <input type="checkbox" required>
                    <a href="#" class="form-link">Foydalanish shartlari</a>ga roziman
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-user-plus"></i>
                Ro'yxatdan o'tish
            </button>
        </form>

        <div class="auth-divider">yoki</div>
        <div class="social-auth">
            <button class="social-auth-btn"><i class="fab fa-google"></i> Google</button>
            <button class="social-auth-btn"><i class="fab fa-telegram"></i> Telegram</button>
        </div>

        <p class="auth-footer">Hisobingiz bormi? <a href="login.html" class="form-link">Kirish</a></p>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
