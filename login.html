<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — TeleMed UZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-heartbeat"></i>
            <span>TeleMed<strong>UZ</strong></span>
        </div>
        <p class="auth-subtitle">Hisobingizga kiring</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Telefon raqam yoki email</label>
                <div class="form-input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-input" placeholder="+998 90 000 00 00" required>
                </div>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <div class="form-input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-input" placeholder="Parolingizni kiriting" required id="passwordInput">
                </div>
            </div>
            <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
                <label class="form-check"><input type="checkbox" checked> Eslab qolish</label>
                <a href="#" class="form-link">Parolni unutdingizmi?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-sign-in-alt"></i>
                Kirish
            </button>
        </form>

        <div class="auth-divider">yoki</div>

        <div class="social-auth">
            <button class="social-auth-btn"><i class="fab fa-google"></i> Google</button>
            <button class="social-auth-btn"><i class="fab fa-telegram"></i> Telegram</button>
        </div>

        <p class="auth-footer">Hisobingiz yo'qmi? <a href="register.html" class="form-link">Ro'yxatdan o'tish</a></p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
